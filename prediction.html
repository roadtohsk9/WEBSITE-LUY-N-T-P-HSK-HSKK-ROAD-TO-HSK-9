<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROAD TO HSK 9 — Prediction</title><link rel="stylesheet" href="css/portal.css"><style>.prediction-gate{border:1px solid #f1ccd1;background:#fff7f8;border-radius:18px;padding:26px;text-align:center;box-shadow:0 12px 30px rgba(16,24,40,.04)}.prediction-gate h2{margin:0 0 8px;color:#7f1d1d}.prediction-gate p{color:#667085;margin:0 0 16px}.prediction-gate .gate-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.prediction-gate a{display:inline-flex;padding:10px 15px;border-radius:11px;text-decoration:none;font-weight:800;border:1px solid #e5e7eb;color:#344054;background:#fff}.prediction-gate a.primary{background:#dc2626;color:#fff;border-color:#dc2626}.hidden{display:none!important}</style><link rel="stylesheet" href="css/eit-motion.css"><link rel="stylesheet" href="css/road-motion.css">
</head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><img src="logo.png"><span><strong>ROAD TO HSK 9</strong><small>Prediction</small></span></a><div class="nav-actions"><a class="btn" href="index.html">Trang chủ</a><a class="btn btn-red" href="test-centre.html">THI THỬ NGAY!</a></div></div></header><main class="section"><div class="container"><div class="eyebrow">WEEKLY PDF</div><h1>IELTS Prediction</h1><p>Prediction được Admin cập nhật theo tuần. Chọn kỹ năng hoặc xem toàn bộ.</p><div id="predictionGate" class="prediction-gate" style="margin:24px 0"></div><div id="predictionContent" class="hidden"><div class="filters" style="margin:20px 0"><button class="filter active" data-s="all">Tất cả</button><button class="filter" data-s="listening">Listening</button><button class="filter" data-s="reading">Reading</button><button class="filter" data-s="writing">Writing</button><button class="filter" data-s="speaking">Speaking</button></div><div id="preds" class="list-grid"></div></div></div></main><script>const qs=new URLSearchParams(location.search),initial=qs.get('skill')||'all';let cur=initial;const root=document.querySelector('#preds'),gate=document.querySelector('#predictionGate'),content=document.querySelector('#predictionContent');function auth(){try{return JSON.parse(localStorage.getItem('currentUser')||'null')}catch{return null}}function showGate(title,msg,actions){gate.innerHTML='<h2>'+title+'</h2><p>'+msg+'</p><div class="gate-actions">'+actions+'</div>';gate.classList.remove('hidden');content.classList.add('hidden')}async function load(){const u=auth();if(!u?.token){showGate('Prediction đang khóa','Bạn cần đăng nhập để kiểm tra quyền truy cập.', '<a class="primary" href="login.html?redirect=prediction.html">Đăng nhập</a>');return}try{const ar=await fetch('/api/me/access',{headers:{Authorization:'Bearer '+u.token}}),a=await ar.json();if(!a.predictionAllowed){showGate('Prediction dành cho PRO','Prediction chỉ mở khi tài khoản có ít nhất 1 gói PRO hoặc đã đăng ký một khóa học EIT.','<a class="primary" href="courses.html">Xem khóa học</a><a href="payment.html?type=pro&skills=2">Mua PRO</a>');return}gate.classList.add('hidden');content.classList.remove('hidden');const r=await fetch('/api/predictions',{headers:{Authorization:'Bearer '+u.token}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Không thể tải Prediction.');const a2=(d.predictions||[]).filter(x=>cur==='all'||x.skill===cur);root.innerHTML=a2.length?a2.map(x=>`<article class="test-card"><span class="tag">${x.skill.toUpperCase()}</span><h3>${x.title}</h3><p>${x.week_label||'Weekly prediction'}</p><a class="go" href="${x.pdf_url}" target="_blank">MỞ PDF →</a></article>`).join(''):'<div class="empty">Chưa có PDF Prediction. Admin sẽ cập nhật tại Admin Dashboard.</div>'}catch(e){showGate('Không thể tải Prediction',e.message||'Vui lòng thử lại.','<a class="primary" href="index.html">Về trang chủ</a>')}}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');cur=b.dataset.s;load()});load();</script><script src="js/app.js"></script><script src="js/road-motion.js" defer></script>
</body></html>
