<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROAD TO HSK 9 — Practice Test</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="css/modules.css"><link rel="stylesheet" href="css/audio-player.css"><link rel="stylesheet" href="css/site.css"><style>body{font-family:"Be Vietnam Pro",Arial,sans-serif}.practice-result{position:fixed;inset:0;z-index:500;background:#f8fafc;overflow:auto;padding:32px}.result-card{max-width:980px;margin:0 auto;background:#fff;border:1px solid #e5e7eb;border-radius:22px;box-shadow:0 20px 70px #1111;overflow:hidden}.result-top{background:linear-gradient(135deg,#991b1b,#d1121e);color:#fff;padding:32px}.result-kicker{font-size:12px;letter-spacing:.12em;font-weight:900}.result-top h1{font-family:"Baloo 2","Be Vietnam Pro",sans-serif;font-size:46px;margin:4px 0}.result-sub{opacity:.9}.score-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px}.score-box{border:1px solid #e5e7eb;border-radius:14px;padding:16px;text-align:center}.score-box strong{display:block;font-size:26px;color:#991b1b}.score-box span{font-size:12px;color:#667085}.band-box{margin:0 18px 18px;padding:18px;border:1px solid #fecaca;background:#fff5f5;border-radius:15px;text-align:center}.band-box b{display:block;font-size:42px;color:#c9001b}.review{padding:0 18px 24px}.review h2{font-family:"Baloo 2","Be Vietnam Pro",sans-serif}.review-item{border:1px solid #e5e7eb;border-left:4px solid #d1121e;border-radius:12px;padding:14px;margin:10px 0}.review-item.ok{border-left-color:#16a34a}.review-status{font-weight:900;font-size:12px}.review-item p{line-height:1.6}.review-exp{margin-top:9px;background:#f8fafc;border-radius:9px;padding:10px;color:#475467;font-size:13px}.result-actions{padding:0 18px 22px;display:flex;gap:10px}.result-actions button{border:0;border-radius:10px;padding:12px 16px;font-weight:900;cursor:pointer}.result-actions .primary{background:#d1121e;color:#fff}.result-actions .secondary{background:#fff;border:1px solid #ddd}.lock-screen{min-height:100vh;display:grid;place-items:center;background:#f8fafc}.lock-card{width:min(520px,calc(100% - 30px));background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:36px;text-align:center}.lock-card svg{width:48px;height:48px;fill:none;stroke:#d1121e;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.lock-card h1{font-family:"Baloo 2","Be Vietnam Pro",sans-serif;font-size:32px;margin:10px 0}.lock-card p{color:#667085;line-height:1.6}.go-login{display:inline-flex;margin-top:10px;padding:12px 18px;border-radius:10px;background:#d1121e;color:#fff;text-decoration:none;font-weight:900}@media(max-width:640px){.score-row{grid-template-columns:1fr}.practice-result{padding:12px}.result-top h1{font-size:36px}}</style><link rel="stylesheet" href="css/personalization.css"><script src="js/personalization.js"></script><link rel="stylesheet" href="css/eit-motion.css"><link rel="stylesheet" href="css/road-motion.css">
