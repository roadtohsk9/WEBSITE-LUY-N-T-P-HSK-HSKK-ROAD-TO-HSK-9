     submitted=false;submitButtons.forEach(b=>{b.disabled=false;b.textContent='Nộp bài'});if(!auto&&remaining>0)interval=setInterval(tick,1000);alert('Không thể nộp bài: '+(error?.message||'Lỗi kết nối')+'\nBài viết vẫn còn trên trang; vui lòng thử lại.');
   }
 }
}
function finish(auto=false){
 if(submitted)return;
 if(isHsk6Writing())return submitHsk6Writing(auto);
 if(!auto&&!confirm('Bạn chắc chắn muốn nộp bài?'))return;
 submitted=true;clearInterval(interval);
 let correct=0,gradable=0;
 const keyFor=(q,i)=>{const k=q.correctAnswer??q.correct_answer??q.answerKey??q.answer??test?.answerKey?.[String(q.number)]??test?.answerKey?.[String(i+1)]??test?.answer_key?.[String(q.number)]??test?.answer_key?.[String(i+1)];return typeof k==='object'?(k.value??k.answer??''):k};
 const review=questions.map((q,i)=>{
   const key=String(keyFor(q,i)??'').trim(),user=String(answers[i]??'').trim();
   const opts=qOptions(q),correctOpt=opts.find(o=>String(o.value).trim().toLowerCase()===key.toLowerCase());
   const userOpt=opts.find(o=>String(o.value).trim().toLowerCase()===user.toLowerCase());
   const gradableHere=!!key,ok=gradableHere&&user.toLowerCase()===key.toLowerCase();
   if(gradableHere){gradable++;if(ok)correct++;}
   const qUnit=Number(q.passage||q.section||q.unit||q.part||groupList.find(g=>String(g.id||'')===String(q.groupId||''))?.unit||1);const groupExp=(test?.content?.question_groups||[]).find(g=>(String(g.id||'')===String(q.groupId||'')&&q.groupId)||(Number(g.unit||g.passage||g.section||1)===qUnit&&Number(g.start||0)<=Number(q.number||i+1)&&Number(g.end||999)>=Number(q.number||i+1)))?.explanation||(test?.content?.question_groups||[]).find(g=>Number(g.unit||g.passage||g.section||1)===qUnit)?.groupExplanation||'';const exp=(q.explanation||test?.explanations?.[String(q.number)]||test?.explanations?.[String(i+1)]||test?.explanations?.[String(q.number)]||groupExp||'').toString();
   const allOptions=opts.map(o=>{const isKey=String(o.value).trim().toLowerCase()===key.toLowerCase(),isUser=!!user&&String(o.value).trim().toLowerCase()===user.toLowerCase();return `<div class="review-option ${isKey?'key':''} ${isUser?'chosen':''}"><b>${esc(o.value)}.</b> ${esc(o.label)} ${isKey?' <strong>· ĐÁP ÁN</strong>':''}${isUser?' <span>(bạn chọn)</span>':''}</div>`}).join('');
   return `<details open class="review-item ${ok?'correct':'wrong'}"><summary><span class="review-state">${!gradableHere?'CHƯA CÓ KEY':ok?'ĐÚNG':'SAI'}</span><span>Câu ${esc(q.number??i+1)}</span><span>Đáp án: ${esc(key||'—')}${correctOpt?' · '+esc(correctOpt.label):''}</span></summary><div class="review-body"><p><b>Câu hỏi:</b> ${esc(qText(q))}</p>${userOpt?`<p class="review-user"><b>Bạn chọn:</b> ${esc(user)} · ${esc(userOpt.label)}</p>`:`<p class="review-user"><b>Bạn chọn:</b> Chưa trả lời</p>`}${correctOpt?`<p class="review-correct"><b>Đáp án đúng:</b> ${esc(key)} · ${esc(correctOpt.label)}</p>`:''}<div>${allOptions}</div><div class="review-explanation"><b>Giải thích</b><br>${exp?esc(exp):'Đề nguồn chưa có giải thích chi tiết cho câu này; chỉ có đáp án key. Admin có thể bổ sung giải thích từ trang quản trị.'}</div></div></details>`;
 }).join('');
 const answered=Object.values(answers).filter(v=>String(v).trim()).length;
 const questionSheet=document.createElement('div');questionSheet.innerHTML=$('paper').innerHTML;questionSheet.querySelectorAll('.actions,#submitBottom,[onclick]').forEach(el=>{if(el.matches('[onclick]'))el.removeAttribute('onclick');if(el.matches('.actions,#submitBottom'))el.remove()});questionSheet.querySelectorAll('input,textarea,select,button').forEach(el=>{if(el.matches('input[type=radio],input[type=checkbox]')){const m=(el.name||'').match(/^q(\d+)$/);if(m){const idx=Number(m[1]);el.checked=String(el.value)===String(answers[idx]??'')}}else if(el.matches('textarea,input:not([type=radio]):not([type=checkbox]),select')){const m=(el.name||'').match(/^q(\d+)$/);if(m){const idx=Number(m[1]);el.value=String(answers[idx]??'')}}el.disabled=true;el.removeAttribute('name')});
 $('paper').classList.add('hidden');$('result').classList.remove('hidden');document.querySelector('.layout')?.classList.add('review-mode');
 $('result').innerHTML=`<div class="review-page-head"><div><div class="muted">${auto?'HẾT GIỜ':'ĐÃ NỘP BÀI'} · ${esc(test.title||'Đề thi HSK')}</div><h1>Đáp án & giải thích chi tiết</h1><p>Đối chiếu đề thi ở bên trái với đáp án và giải thích từng câu ở bên phải. Hai khung có thể cuộn độc lập để bạn kiểm tra dễ hơn.</p></div><div class="review-score-chip">${gradable?`Đúng ${correct}/${gradable} · ${Math.round(correct/gradable*100)}%`:'Chưa có answer key để chấm tự động'}</div></div><div class="split-review-layout"><section class="split-review-pane"><div class="split-pane-heading">📄 ĐỀ THI · ${esc(String(test.skill||'').toUpperCase())}</div><div class="split-pane-scroll split-question-content">${questionSheet.innerHTML}</div></section><section class="split-review-pane"><div class="split-pane-heading">✓ ĐÁP ÁN & GIẢI THÍCH TỪNG CÂU</div><div class="split-pane-scroll split-answer-content"><div class="review-overview"><b>Kết quả làm bài</b><br>Đã trả lời: ${answered}/${questions.length}<br>${gradable?`Số câu đúng: ${correct}/${gradable}<br>Tỷ lệ đúng: ${Math.round(correct/gradable*100)}%`:'Đề này chưa có answer key đầy đủ. Các câu chưa có key sẽ được ghi rõ bên dưới.'}</div>${review}</div></section></div><div class="actions" style="margin:16px 0 4px"><a class="btn secondary" href="/">Về kho đề</a><a class="btn secondary" href="/personalization.html">Xem tiến độ cá nhân</a><button class="btn" onclick="location.reload()">Làm lại</button></div>`;
 try{window.EITPersonal?.saveHistory({testId:String(test.id||id||''),testTitle:String(test.title||'Đề thi HSK'),skill:String(test.skill||''),level:Number(test.volume||0),score:correct,total:gradable,correct,gradable,totalQuestions:questions.length,answered,elapsedSeconds:Math.max(0,Math.round((Number(test.durationMinutes||60)*60)-remaining)),autoSubmitted:!!auto})}catch(e){console.warn('Could not save HSK learning progress',e)}
 $('submit').disabled=true;$('submit').textContent='Đã nộp bài';window.scrollTo({top:0,behavior:'smooth'});
}
$('submit').onclick=()=>finish();window.getHSKPersonalMeta=()=>({testId:String(test?.id||id||''),testTitle:String(test?.title||'Đề thi HSK'),skill:String(test?.skill||''),level:Number(test?.volume||0)});let signedUser=null;try{signedUser=JSON.parse(localStorage.getItem('currentUser')||'null')}catch{}if(signedUser?.token){$('examGreeting').textContent=`Xin chào ${signedUser.username||signedUser.registrationid||signedUser.eitcode||signedUser.fullname||'Học viên'}`;}if(!signedUser?.token){if(id)localStorage.setItem('loginRedirect',location.pathname+location.search);location.replace('/login.html')}else if(!id){$('intro').innerHTML='<h1>Thiếu mã đề</h1><a href="/">Quay lại kho đề</a>'}else fetch('/api/practice/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+signedUser.token}}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.message||'Không thể tải đề');return d}).then(d=>{test=d.test;questions=extractQuestions(parseContent(test.content));render()}).catch(e=>{$('intro').innerHTML=`<h1>Không mở được đề thi</h1><p class="muted">${esc(e.message)}</p><a class="btn" href="/">Quay lại kho đề</a>`});
</script><script src="js/personalization.js"></script><script src="js/hsk-personal-tools.js"></script><script src="js/road-motion.js" defer></script>
