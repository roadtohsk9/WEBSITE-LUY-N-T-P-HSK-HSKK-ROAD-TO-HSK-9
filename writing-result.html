<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROAD TO HSK 9 — Kết quả AI Writing</title><link rel="stylesheet" href="ai-review.css"><link rel="icon" type="image/png" href="/logo.png"><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><link rel="stylesheet" href="css/eit-motion.css"><link rel="stylesheet" href="css/road-motion.css">
</head><body class="ai-page"><div class="ai-shell"><header class="ai-head"><div class="ai-brand"><img src="/logo.png" alt="ROAD TO HSK 9"><div><b>ROAD TO HSK 9</b><span>Giáo viên AI IELTS · Writing</span></div></div><a class="ai-link" href="index.html">Quay lại khu luyện thi</a></header><main id="app"><div class="loading"><div class="loading-spinner"></div>Loading your AI Writing result…</div></main></div>
<script>
const id=new URLSearchParams(location.search).get('id');const token=JSON.parse(localStorage.getItem('currentUser')||'{}').token||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=a=>Array.isArray(a)?a:[];function addPdfButton(skill){const app=document.getElementById('app');if(!app||document.getElementById('downloadPdf'))return;const bar=document.createElement('div');bar.className='pdf-toolbar';bar.innerHTML='<button id=\"downloadPdf\" class=\"pdf-download\" type=\"button\">⬇ TẢI FEEDBACK PDF</button><span>Xuất toàn bộ kết quả và feedback đang hiển thị.</span>';app.prepend(bar);document.getElementById('downloadPdf').onclick=async()=>{const b=document.getElementById('downloadPdf');b.disabled=true;b.textContent='ĐANG TẠO PDF…';try{await html2pdf().set({margin:8,filename:'EIT-IELTS-'+skill+'-feedback-'+(id||'result')+'.pdf',image:{type:'jpeg',quality:.96},html2canvas:{scale:1.45,useCORS:true,backgroundColor:'#f8fafc'},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'},pagebreak:{mode:['css','legacy']}}).from(app).save()}finally{b.disabled=false;b.textContent='⬇ TẢI FEEDBACK PDF'}};}const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
const critLabels={task1:{task_achievement:'Task Achievement',coherence_cohesion:'Coherence & Cohesion',lexical_resource:'Lexical Resource',grammar:'Grammatical Range & Accuracy'},task2:{task_response:'Task Response',coherence_cohesion:'Coherence & Cohesion',lexical_resource:'Lexical Resource',grammar:'Grammatical Range & Accuracy'}};
function criteria(c,labels){return `<div class="ai-grid">${Object.entries(labels).map(([k,v])=>`<div class="ai-criterion"><span>${v}</span><strong>${Number(c?.[k]??0).toFixed(1)}</strong></div>`).join('')}</div>`}
function list(title,items){const a=arr(items);return a.length?`<div class="feedback-block"><h4>${esc(title)}</h4><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
function paragraphReview(items){const a=arr(items);if(!a.length)return '';return `<div class="paragraph-review"><div class="paragraph-review-head"><div><span class="mini-kicker">PARAGRAPH BY PARAGRAPH</span><h3>Phân tích từng đoạn của học sinh</h3></div><span class="paragraph-review-note">Không dồn lỗi thành một bảng chung</span></div>${a.map(p=>`<article class="paragraph-card"><div class="paragraph-card-top"><span>ĐOẠN ${esc(p.paragraph)}</span><b>${esc(p.next_step||'')}</b></div><div class="paragraph-excerpt">${esc(p.excerpt||'')}</div><p class="paragraph-summary">${rich(p.summary||'')}</p>${arr(p.grammar_errors).length?`<div class="paragraph-section"><h4>🔴 Lỗi ngữ pháp trong đoạn</h4><div class="grammar-issue-list">${arr(p.grammar_errors).map(e=>`<div class="grammar-issue"><div class="issue-copy"><span>Vị trí</span><b>${esc(e.location||'')}</b></div><div class="issue-original"><span>Bạn viết</span><strong>${esc(e.original||'')}</strong></div><div class="issue-correct"><span>Nên sửa</span><strong>${esc(e.corrected||'')}</strong></div><div class="issue-rule"><b>${esc(e.rule||'')}</b><p>${rich(e.explanation||'')}</p></div></div>`).join('')}</div></div>`:''}${(arr(p.vocabulary_notes).length||arr(p.cohesion_notes).length)?`<div class="paragraph-mini-grid">${arr(p.vocabulary_notes).length?`<div><h4>🟠 Từ vựng / collocation</h4><ul>${arr(p.vocabulary_notes).map(x=>`<li>${rich(x)}</li>`).join('')}</ul></div>`:''}${arr(p.cohesion_notes).length?`<div><h4>🔵 Coherence & Cohesion</h4><ul>${arr(p.cohesion_notes).map(x=>`<li>${rich(x)}</li>`).join('')}</ul></div>`:''}</div>`:''}</article>`).join('')}</div>`}
function taskCard(t,label,detail){const labels=critLabels[label.toLowerCase().replace(' ','')]||critLabels[label==='Task 1'?'task1':'task2'];return `<section class="ai-card ai-task section"><div class="task-title"><h2>${label}</h2><span class="band-pill">Band ${Number(t?.band??0).toFixed(1)}</span></div>${criteria(t?.criteria,labels)}<div class="feedback-grid"><div class="insight"><h4>🧑‍🏫 Nhận xét của giám khảo</h4><p>${rich(t?.summary||'')}</p></div><div class="insight"><h4>🎯 Lỗi/điểm yếu cần ưu tiên sửa</h4>${list('',t?.improvements).replace('<div class="feedback-block"><h4></h4>','<div class="feedback-block"><h4>')}</div></div>${list('Strengths',t?.strengths)}${detail?paragraphReview(t?.paragraph_analysis):''}${detail?list('🛠 Kế hoạch cải thiện từng bước',t?.improvement_plan):''}${detail?list('📚 Từ vựng nâng cấp · nghĩa & ngữ cảnh',t?.vocabulary_upgrades):''}${detail?list('📈 Kế hoạch nâng band',t?.band_upgrade_plan):''}${detail?`<div class="feedback-block"><h4>✨ Đoạn văn nâng cấp bởi AI</h4><div class="transcript">${esc(t?.revised_excerpt||'')}</div></div>`:''}${detail?`<div class="feedback-block"><h4>🔎 Phân tích từng lỗi · Cách dùng · Logic</h4><div style="overflow:auto"><table class="error-table"><thead><tr><th>Câu gốc</th><th>Câu sửa</th><th>Loại lỗi</th><th>Vì sao?</th><th>Cách dùng / ngữ cảnh</th><th>Logic / quy tắc</th><th>Cách diễn đạt tốt hơn</th></tr></thead><tbody>${arr(t?.errors).map(e=>`<tr><td><strong>${esc(e.original)}</strong></td><td class="good-cell"><strong>${esc(e.corrected)}</strong></td><td>${rich(e.error_type)}</td><td>${rich(e.explanation)}</td><td>${rich(e.context||'')}</td><td>${rich(e.rule||'')}</td><td>${esc(e.better_option)}</td></tr>`).join('')||'<tr><td colspan="7">No high-impact errors detected.</td></tr>'}</tbody></table></div></div>`:''}</section>`}
async function load(){try{if(!id)throw Error('Missing submission ID.');const r=await fetch('/api/ai/review/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Unable to load result.');if(d.status==='failed'){document.getElementById('app').innerHTML=`<div class="error-box"><b>AI Writing grading is not available yet.</b><div style="margin-top:7px">${esc(d.errorMessage||'Please try again later.')}</div></div>`;return}const detail=!!d.detailAllowed,x=d.review||{};document.getElementById('app').innerHTML=`<section class="ai-hero"><div class="eyebrow">IELTS WRITING · KẾT QUẢ AI</div><h1>Phân tích Writing chi tiết</h1><p>AI chấm nghiêm theo logic IELTS, giải thích bằng tiếng Việt và chỉ ra <strong>lỗi → lý do → ngữ cảnh → quy tắc → cách sửa</strong>. Task 2 có trọng số gấp đôi Task 1.</p><div class="ai-overall"><div><div class="score-orb"><div class="score-inner"><div class="ai-score">${Number(d.overallBand??0).toFixed(1)}</div><div class="score-label">Band Writing</div></div></div><div class="hero-meta"><span class="hero-chip">4 tiêu chí</span><span class="hero-chip">Task 2 ×2 trọng số</span><span class="hero-chip">Giám khảo AI</span></div></div><div style="max-width:650px;width:100%"><div class="eyebrow">TỔNG QUAN GIÁM KHẢO</div><p style="font-size:15px;margin-top:7px">${esc(x.examiner_summary||'Kết quả được đánh giá trên cả hai task.')}</p></div></div></section>${taskCard(x.task1,'Task 1',detail)}${taskCard(x.task2,'Task 2',detail)}${detail?`<section class="ai-card section"><div class="eyebrow">NEXT LEVEL</div><div class="pro-title"><h3>Lộ trình cải thiện cá nhân</h3><span class="pro-badge">EIT PRO</span></div>${list('🔥 Ưu tiên sửa ngay',x.priority_fixes)}${list('➡️ Việc nên làm tiếp theo',x.action_plan)}</section>`:`<section class="ai-card section"><div class="locked"><div><h3>Mở khóa phân tích Writing đầy đủ</h3><p>PRO có sửa từng câu, giải thích bằng tiếng Việt, ngữ cảnh sử dụng, quy tắc, nâng cấp từ vựng, đoạn văn mẫu và kế hoạch nâng band.</p></div><span class="pro-badge">EIT PRO</span></div></section>`}`;}catch(e){document.getElementById('app').innerHTML=`<div class="error-box">${esc(e.message)}</div>`}}load();
</script><script src="js/road-motion.js" defer></script>
</body></html>
