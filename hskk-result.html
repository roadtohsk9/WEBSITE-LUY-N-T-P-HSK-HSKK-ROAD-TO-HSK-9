<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSKK · Kết quả và nhận xét AI</title><style>
:root{--blue:#2563eb;--deep:#17449a;--ink:#213858;--muted:#8190a7;--line:#e1eaf7;--bg:#f3f7fd}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.55 Inter,"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink)}.top{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 max(18px,calc((100vw - 1180px)/2));gap:12px}.brand{display:flex;align-items:center;gap:10px;color:#17449a;font-weight:900}.logo{height:36px;width:36px;border-radius:10px;background:linear-gradient(140deg,#173f91,#3b82f6);color:white;display:grid;place-items:center}.top a{color:#3564b3;text-decoration:none;font-size:11px;font-weight:800}.wrap{max-width:1180px;padding:22px 18px;margin:auto}.hero{background:linear-gradient(120deg,#143d91,#286fe2 75%,#58a0ef);padding:24px 27px;border-radius:18px;color:white;display:flex;justify-content:space-between;align-items:center;gap:20px}.hero small{font-size:9px;font-weight:900;letter-spacing:.14em;color:#cbdcff}.hero h1{font-size:24px;margin:7px 0}.hero p{font-size:11px;color:#e0ecff;margin:0}.score{min-width:145px;text-align:center;background:#ffffff1c;border:1px solid #ffffff45;border-radius:15px;padding:15px}.score strong{font-size:38px;line-height:1;display:block}.score span{font-size:9px;color:#e4efff;font-weight:850;letter-spacing:.1em}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:15px;margin-top:15px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 4px 18px #234b8610}.card h2{font-size:16px;color:#1d468d;margin:0 0 13px}.summary{font-size:12px;color:#697f9e;line-height:1.8}.criteria{display:grid;gap:12px}.criterion{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:11px}.criterion b{color:#486389}.track{height:8px;border-radius:20px;background:#edf2f9;overflow:hidden}.track span{height:100%;display:block;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:20px}.val{text-align:right;font-weight:850;color:#245bc0;font-variant-numeric:tabular-nums}.feedback-list{display:grid;gap:11px}.q-card{border:1px solid var(--line);border-radius:12px;padding:14px}.q-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.q-head b{color:#28538f;font-size:12px}.tag{font-size:9px;color:#3265c1;background:#eef4ff;padding:5px 8px;border-radius:6px;font-weight:850}.q-score{font-weight:900;color:#1e5abd;font-size:17px}.q-card p{font-size:11px;color:#6c7f9b;line-height:1.7;margin:9px 0}.q-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q-cols>div{background:#f7f9fd;border-radius:9px;padding:10px;font-size:10px;color:#647895}.q-cols b{display:block;color:#355582;margin-bottom:5px}.pill-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pill-list span{font-size:10px;padding:6px 8px;background:#edf4ff;border-radius:7px;color:#365f9e}.note-area{width:100%;min-height:125px;border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.7 inherit;resize:vertical;color:#364e70}.btn{border:0;border-radius:9px;background:#2563eb;color:white;padding:10px 13px;font-size:11px;font-weight:850;cursor:pointer}.btn.ghost{background:#fff;border:1px solid var(--line);color:#365d96}.note-actions{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:8px}.notice{padding:12px;background:#f1f6ff;border:1px solid #e0eaff;color:#58739a;border-radius:10px;font-size:11px;line-height:1.7}.notice.error{background:#fff1ef;border-color:#ffdbd7;color:#9b3028}.spinner{width:25px;height:25px;border:3px solid #dce9fb;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.empty{text-align:center;padding:55px;color:#7f90a8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.score{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}.score strong{font-size:32px}.top{padding:0 12px}.wrap{padding:12px}.criterion{grid-template-columns:120px 1fr 38px}}@media(max-width:500px){.q-cols{grid-template-columns:1fr}.criterion{grid-template-columns:100px 1fr 35px}}
</style></head><body><header class="top"><div class="brand"><span class="logo">听</span> HSKK · AI FEEDBACK</div><a href="/hskk.html">← Quay lại HSKK</a></header><main class="wrap" id="root"><div class="empty"><div class="spinner"></div><p>Đang tải kết quả và feedback…</p></div></main><script>
(()=>{const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');const user=()=>{try{return JSON.parse(localStorage.getItem('currentUser')||'null')}catch{return null}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names={taskCompletion:'Hoàn thành yêu cầu',pronunciation:'Phát âm & thanh điệu',fluency:'Độ lưu loát',grammar:'Ngữ pháp',vocabulary:'Từ vựng',comprehensibility:'Mức độ dễ hiểu'};const typeNames={listen_repeat:'Nghe và nhắc lại',listen_answer:'Nghe và trả lời',picture_description:'Mô tả tranh',answer_question:'Trả lời câu hỏi',listen_restate:'Nghe nhắc lại / kể lại',read_aloud:'Đọc thành tiếng'};function headers(){return user()?.token?{Authorization:'Bearer '+user().token}:{}}async function load(){if(!id)throw Error('Thiếu mã kết quả.');if(!user()?.token){localStorage.setItem('loginRedirect',location.pathname+location.search);location.href='/login.html';return}const r=await fetch('/api/ai/review/'+encodeURIComponent(id),{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.message||'Không tải được feedback.');render(d)}function render(d){const r=d.review||{},score=d.overallScore??r.overallScore,criteria=r.criteria||{},notes=localStorage.getItem('hskkNote:'+id)||'';const criteriaHtml=Object.entries(names).map(([k,n])=>{const v=Math.max(0,Math.min(100,Number(criteria[k]||0)));return `<div class="criterion"><b>${n}</b><div class="track"><span style="width:${v}%"></span></div><span class="val">${v}</span></div>`}).join('');const qs=r.questionFeedback||[];const questions=qs.map(q=>`<article class="q-card"><div class="q-head"><b>Câu ${q.questionNumber||'—'} · ${esc(typeNames[q.questionType]||q.questionType||'HSKK')}</b><span class="q-score">${Number(q.score||0)}/100</span></div>${q.transcript?`<p><b>Bản nhận diện:</b> ${esc(q.transcript)}</p>`:''}<p>${esc(q.feedback||'')}</p><div class="q-cols"><div><b>Điểm tốt</b>${(q.strengths||[]).map(x=>`<div>• ${esc(x)}</div>`).join('')||'—'}</div><div><b>Cần cải thiện</b>${(q.improvements||[]).map(x=>`<div>• ${esc(x)}</div>`).join('')||'—'}</div></div></article>`).join('');$('root').innerHTML=`<section class="hero"><div><small>HSK SPEAKING · AI EXAMINER REPORT</small><h1>Kết quả bài thi HSKK</h1><p>${esc(d.hskkVersion==='3.0'?'HSK Speaking 3.0':'HSKK 2.0')} · ${esc(({beginner:'Sơ cấp',intermediate:'Trung cấp',advanced:'Cao cấp'})[d.hskkLevel]||'HSKK')} · Model ${esc(d.model||'Gemini')}</p></div><div class="score"><strong>${score==null?'—':Number(score).toFixed(1)}</strong><span>ĐIỂM / 100</span></div></section><div class="grid"><div style="display:grid;gap:15px"><section class="card"><h2>Nhận xét tổng quan</h2>${d.status==='failed'?`<div class="notice error">Bản ghi của bạn đã được lưu nhưng AI chưa chấm được: ${esc(d.errorMessage||'Vui lòng thử lại sau.')}</div>`:`<p class="summary">${esc(r.examinerSummary||'Chưa có nhận xét tổng quan.')}</p>`}${d.detailAllowed===false?'<div class="notice" style="margin-top:12px">Bạn đang xem bản tóm tắt. Mở PRO HSKK để xem feedback đầy đủ từng câu, transcript và kế hoạch luyện tập chi tiết.</div>':''}</section><section class="card"><h2>Điểm theo tiêu chí</h2><div class="criteria">${criteriaHtml||'<div class="summary">Chưa có dữ liệu tiêu chí.</div>'}</div></section><section class="card"><h2>Feedback theo từng câu</h2><div class="feedback-list">${questions||'<div class="notice">Chưa có feedback từng câu.</div>'}</div></section><section class="card"><h2>Ưu tiên cải thiện</h2><div class="pill-list">${(r.priorityFixes||[]).map(x=>`<span>${esc(x)}</span>`).join('')||'<span>Chưa có gợi ý.</span>'}</div><h2 style="margin-top:18px">Kế hoạch luyện tập</h2><div class="summary">${(r.practicePlan||[]).map(x=>`<p>• ${esc(x)}</p>`).join('')||'Chưa có kế hoạch.'}</div></section></div><aside style="display:grid;gap:15px;align-content:start"><section class="card"><h2>Take note sau bài thi</h2><p class="summary">Ghi lại lỗi phát âm, từ mới hoặc mục tiêu cho lần luyện tiếp theo. Ghi chú được lưu ở trình duyệt này.</p><textarea id="note" class="note-area" placeholder="Ví dụ: luyện thanh 3–4, giảm ngập ngừng, mở rộng câu trả lời..."></textarea><div class="note-actions"><span id="noteStatus" class="muted">Ghi chú riêng</span><button class="btn" id="saveNote">Lưu ghi chú</button></div></section><section class="card"><h2>Bước tiếp theo</h2><div class="notice">Hãy nghe lại những câu bạn thấy chưa trôi chảy, luyện phát âm theo cụm từ và tự đặt câu trả lời dài hơn nhưng vẫn đúng trọng tâm.</div><div class="actions"><a class="btn" style="text-decoration:none" href="/hskk.html">Luyện đề HSKK khác</a><a class="btn ghost" style="text-decoration:none" href="/">Về Dashboard</a></div></section></aside></div>`;$('note').value=notes;$('saveNote').onclick=()=>{localStorage.setItem('hskkNote:'+id,$('note').value);$('noteStatus').textContent='✓ Đã lưu';};}load().catch(e=>{$('root').innerHTML=`<div class="empty"><h2>Không tải được kết quả</h2><div class="notice error">${esc(e.message)}</div><p><a href="/hskk.html">Quay lại HSKK</a></p></div>`});})();
</script></body></html>
