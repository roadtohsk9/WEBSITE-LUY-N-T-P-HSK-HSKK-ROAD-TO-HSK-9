<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSKK · AI Feedback</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="css/road-motion.css"><style>
:root{--blue:#1d4ed8;--ink:#14243c;--muted:#64748b;--line:#dce5f1;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}.head{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 max(20px,calc((100vw - 1160px)/2))}.brand{font-weight:950;color:var(--blue);text-decoration:none}.back{font-size:12px;color:#2563eb;text-decoration:none;font-weight:800}.wrap{max-width:1160px;margin:24px auto;padding:0 18px}.hero{background:linear-gradient(125deg,#143a7a,#2563eb);color:#fff;border-radius:20px;padding:26px;box-shadow:0 18px 40px #1e40af20}.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:950;opacity:.78}.hero h1{font-size:28px;margin:7px 0}.hero p{color:#dbeafe;line-height:1.65;max-width:800px}.score-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:20px}.score-orb{width:112px;height:112px;border-radius:50%;background:#ffffff20;border:5px solid #bfdbfe;display:grid;place-items:center;text-align:center}.score-orb strong{font-size:31px;display:block;line-height:1}.score-orb small{font-size:9px;text-transform:uppercase;letter-spacing:.1em}.hero-meta{font-size:12px;line-height:1.7}.warn{background:#fffbeb;border:1px solid #fcd34d;color:#854d0e;padding:13px;border-radius:12px;margin:16px 0;font-size:12px;line-height:1.6}.tabs{display:flex;gap:7px;overflow-x:auto;padding:13px 0;margin:10px 0}.tab{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:12px;font-weight:850;color:#475569;cursor:pointer}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.content{display:none}.content.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;margin:0 0 14px}.card h2{font-size:18px;margin:0 0 12px}.card h3{font-size:14px;margin:0 0 8px}.muted{color:var(--muted);font-size:12px;line-height:1.65}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}.metric span{font-size:11px;color:var(--muted);font-weight:800}.metric strong{display:block;font-size:25px;margin:5px 0}.bar{height:7px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#3b82f6}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{margin:8px 0 0;padding-left:19px;color:#334155;font-size:13px;line-height:1.7}.list li{margin:4px 0}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.info{padding:13px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}.info b{display:block;font-size:11px;color:#475569;margin-bottom:5px}.info p{margin:0;font-size:13px;line-height:1.6}.question{border:1px solid var(--line);border-radius:13px;margin:10px 0;overflow:hidden}.qhead{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#f8fbff;gap:10px}.qhead strong{font-size:13px}.qscore{background:#dbeafe;color:#1e40af;border-radius:999px;padding:5px 9px;font-weight:900;font-size:11px}.qbody{padding:14px}.transcript{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;font-size:13px;line-height:1.7}.example{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.example div{font-size:12px;line-height:1.6}.example small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}.callout{padding:12px;border-left:3px solid #60a5fa;background:#eff6ff;border-radius:0 10px 10px 0;font-size:13px;line-height:1.7}.empty{padding:24px;background:#fff;border:1px dashed #cbd5e1;border-radius:13px;color:#64748b;text-align:center}.error{padding:18px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px}.footer{text-align:center;color:#94a3b8;font-size:11px;padding:28px}@media(max-width:800px){.metric-grid{grid-template-columns:repeat(2,1fr)}.two-col,.info-grid{grid-template-columns:1fr}}@media(max-width:520px){.head{padding:0 12px}.wrap{margin:12px auto;padding:0 10px}.hero{padding:20px}.hero h1{font-size:23px}.score-orb{width:90px;height:90px}.metric-grid{grid-template-columns:1fr 1fr}.example{grid-template-columns:1fr}}
</style></head><body><header class="head"><a class="brand" href="/">ROAD TO HSK 9</a><a class="back" href="/hskk.html">← Về kho đề HSKK</a></header>
<main class="wrap" id="app"><div class="empty">Đang tải kết quả và feedback từ Gemini…</div></main><footer class="footer">AI Feedback · Phân tích luyện tập khẩu ngữ · Không phải bảng điểm chính thức của CTI</footer>
<script>
const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');const user=(()=>{try{return JSON.parse(localStorage.getItem('currentUser')||'null')}catch{return null}})();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=x=>Array.isArray(x)?x:[];const text=x=>String(x??'');const safeScore=x=>Number.isFinite(Number(x))?Math.max(0,Math.min(100,Number(x))):0;
function list(items){return arr(items).length?`<ul class="list">${arr(items).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">Chưa phát hiện nhận xét nổi bật ở mục này.</p>'}
function metric(name,obj){const score=safeScore(obj?.score);return `<div class="metric"><span>${esc(name)}</span><strong>${score.toFixed(0)}<small style="font-size:11px;color:#64748b"> / 100</small></strong><div class="bar"><i style="width:${score}%"></i></div><p class="muted">${esc(obj?.summary||'')}</p></div>`}
function dimensionCard(title,obj,extra=''){return `<section class="card"><h2>${esc(title)} · ${safeScore(obj?.score).toFixed(0)}/100</h2><p class="muted">${esc(obj?.summary||'')}</p><div class="two-col"><div><h3>Điểm mạnh</h3>${list(obj?.strengths)}</div><div><h3>Cần cải thiện</h3>${list(obj?.issues)}</div></div>${extra}</section>`}
function renderResult(r){const f=r.feedback||{},d=f.dimensions||{};const score=r.totalScore??f.totalScore??0;const dims=[['Phát âm',d.pronunciation],['Độ trôi chảy',d.fluency],['Mạch lạc & liên kết',d.coherence],['Phát triển ý',d.ideaDevelopment],['Ngữ pháp',d.grammar],['Từ vựng',d.vocabulary],['Hoàn thành nhiệm vụ',d.taskAchievement]];const tabs=[['overview','Tổng quan'],['pronunciation','Phát âm'],['fluency','Độ trôi chảy'],['logic','Logic & ý tưởng'],['language','Ngữ pháp & từ vựng'],['questions','Phản hồi từng câu'],['plan','Kế hoạch cải thiện']];
$('app').innerHTML=`<section class="hero"><div class="eyebrow">GOOGLE GEMINI · SPEAKING REVIEW</div><h1>Phân tích bài thi khẩu ngữ</h1><p>${esc(r.examTitle||'HSKK Speaking')} · ${esc(r.version||'')} · ${esc(r.levelLabel||'')}<br>${esc(f.overallSummary||'Gemini đã phân tích bài nói theo các tiêu chí phát âm, trôi chảy, logic, phát triển ý, ngữ pháp và từ vựng.')}</p><div class="score-row"><div class="score-orb"><div><strong>${safeScore(score).toFixed(0)}</strong><small> / 100</small></div></div><div class="hero-meta"><b>Điểm luyện tập ước lượng</b><br>${esc(f.levelEstimate||'Mức độ hiện tại chưa được phân loại')}<br>Ngày nộp: ${r.submittedAt?new Date(r.submittedAt).toLocaleString('vi-VN'):'—'}<br>AI: Google Gemini · ${esc(f.model||'')}</div></div></section>
<div class="warn"><b>Quan trọng:</b> Đây là phản hồi tự động phục vụ luyện tập, không phải điểm thi chính thức. Đánh giá thanh điệu và âm vị có thể bị ảnh hưởng bởi micro, tiếng ồn, giọng vùng miền và chất lượng ghi âm. ${esc(f.confidenceNote||'')}</div>
<nav class="tabs">${tabs.map(([k,l],i)=>`<button class="tab ${i===0?'active':''}" data-tab="${k}">${l}</button>`).join('')}</nav>
<section class="content active" id="tab-overview"><div class="card"><h2>Bản đồ năng lực</h2><div class="metric-grid">${dims.map(([n,o])=>metric(n,o)).join('')}</div></div><div class="two-col"><div class="card"><h2>Điểm mạnh chính</h2>${list(arr(d.pronunciation?.strengths).slice(0,2).concat(arr(d.fluency?.strengths).slice(0,2),arr(d.coherence?.strengths).slice(0,2)))}</div><div class="card"><h2>Ưu tiên cải thiện</h2>${list(f.priorityFixes)}</div></div><div class="card"><h2>Nhận xét tổng quát</h2><div class="callout">${esc(f.overallSummary||'Gemini chưa trả về nhận xét tổng quát.')}</div></div></section>
<section class="content" id="tab-pronunciation">${dimensionCard('Phát âm & thanh điệu',d.pronunciation,`<div class="info-grid"><div class="info"><b>Thanh điệu</b><p>${esc(f.pronunciationAnalysis?.toneAccuracy||'Chưa có phân tích.')}</p></div><div class="info"><b>Thanh mẫu / vận mẫu</b><p>${esc(f.pronunciationAnalysis?.initialFinal||'Chưa có phân tích.')}</p></div><div class="info"><b>Nhịp điệu / ngữ điệu</b><p>${esc(f.pronunciationAnalysis?.rhythm||'Chưa có phân tích.')}</p></div><div class="info"><b>Độ rõ / dễ hiểu</b><p>${esc(f.pronunciationAnalysis?.intelligibility||'Chưa có phân tích.')}</p></div></div><h3 style="margin-top:14px">Bài tập phát âm mục tiêu</h3>${list(d.pronunciation?.practiceDrills)}`)}</section>
<section class="content" id="tab-fluency">${dimensionCard('Độ trôi chảy',d.fluency,`<h3 style="margin-top:14px">Bài tập gợi ý</h3>${list(d.fluency?.practiceDrills)}`)}</section>
<section class="content" id="tab-logic">${dimensionCard('Mạch lạc & liên kết',d.coherence)}${dimensionCard('Phát triển ý tưởng',d.ideaDevelopment)}<div class="card"><h2>Phân tích logic câu trả lời</h2><div class="info-grid">${[['Cấu trúc','structure'],['Đúng trọng tâm','relevance'],['Ví dụ / dẫn chứng','examples'],['Từ nối / chuyển ý','transitions']].map(([a,k])=>`<div class="info"><b>${a}</b><p>${esc(f.logicAnalysis?.[k]||'Chưa có phân tích.')}</p></div>`).join('')}</div></div></section>
<section class="content" id="tab-language">${dimensionCard('Ngữ pháp',d.grammar,`<h3 style="margin-top:14px">Câu nên sửa</h3>${arr(d.grammar?.examples).map(x=>`<div class="example"><div><small>Đang dùng</small>${esc(x.original)}</div><div><small>Cách diễn đạt tốt hơn</small>${esc(x.improved)}<p class="muted">${esc(x.why)}</p></div></div>`).join('')||'<p class="muted">Không có ví dụ sửa câu.</p>'}`)}${dimensionCard('Từ vựng',d.vocabulary,`<h3 style="margin-top:14px">Nâng cấp diễn đạt</h3>${arr(d.vocabulary?.upgrades).map(x=>`<div class="example"><div><small>Từ cơ bản</small>${esc(x.basic)}</div><div><small>Cách diễn đạt tự nhiên</small>${esc(x.natural)}<p class="muted">${esc(x.context)}</p></div></div>`).join('')||'<p class="muted">Không có gợi ý nâng cấp từ.</p>'}`)}${dimensionCard('Hoàn thành yêu cầu đề',d.taskAchievement)}</section>
<section class="content" id="tab-questions"><div class="card"><h2>Phản hồi chi tiết theo từng câu</h2><p class="muted">Mỗi câu hiển thị bản chép lời AI nhận diện, điểm riêng, điểm mạnh, lỗi nổi bật và cách cải thiện.</p>${arr(f.perQuestion).map((q,i)=>`<article class="question"><div class="qhead"><strong>Câu ${i+1} · ${esc(q.sectionTitle||q.taskType||'Speaking')}</strong><span class="qscore">${safeScore(q.score).toFixed(0)}/100</span></div><div class="qbody"><p>${esc(q.summary||'')}</p><h3>Transcript · Bản chép lời</h3><div class="transcript">${esc(q.transcript||'[Không nhận diện được lời nói rõ ràng]')}</div><div class="two-col" style="margin-top:12px"><div><h3>Điểm mạnh</h3>${list(q.strengths)}</div><div><h3>Cần cải thiện</h3>${list(q.issues)}</div></div>${q.repeatAccuracy?`<div class="info-grid" style="margin-top:10px"><div class="info"><b>Văn bản tham chiếu</b><p>${esc(q.repeatAccuracy.reference||'Không có văn bản chuẩn')}</p></div><div class="info"><b>Từ bị thiếu / thêm</b><p>Thiếu: ${esc(q.repeatAccuracy.missing||'—')}<br>Thêm: ${esc(q.repeatAccuracy.added||'—')}</p></div></div><p class="muted">${esc(q.repeatAccuracy.note||'')}</p>`:''}${q.suggestedResponse?`<h3 style="margin-top:12px">Gợi ý trả lời cải thiện</h3><div class="transcript">${esc(q.suggestedResponse)}</div>`:''}</div></article>`).join('')||'<div class="empty">Gemini chưa trả về phân tích từng câu.</div>'}</div></section>
<section class="content" id="tab-plan"><div class="card"><h2>3–5 ưu tiên sửa trước</h2>${list(f.priorityFixes)}</div><div class="card"><h2>Lộ trình luyện tập cá nhân</h2>${arr(f.actionPlan).map((x,i)=>`<article class="question"><div class="qhead"><strong>${i+1}. ${esc(x.focus||'Trọng tâm luyện tập')}</strong></div><div class="qbody"><p><b>Bài tập:</b> ${esc(x.practice||'')}</p><p><b>Tần suất:</b> ${esc(x.frequency||'')}</p><p><b>Cách đo tiến bộ:</b> ${esc(x.successMeasure||'')}</p></div></article>`).join('')||'<p class="muted">Chưa có kế hoạch luyện tập.</p>'}</div></section>`;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.content').forEach(x=>x.classList.toggle('active',x.id==='tab-'+b.dataset.tab))})}
let pollTimer=null;async function load(){try{if(!user?.token)throw Error('Bạn cần đăng nhập lại để xem kết quả.');if(!id)throw Error('Thiếu mã kết quả.');const r=await fetch('/api/hskk/result/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+user.token}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Không thể tải kết quả.');const x=d.result;if(x.status==='pending'){$('app').innerHTML=`<section class="hero"><div class="eyebrow">GOOGLE GEMINI · SPEAKING REVIEW</div><h1>Đang phân tích bài nói</h1><p>Bài thi của bạn đã được lưu an toàn. Gemini đang nghe và đánh giá từng bản ghi; trang này sẽ tự cập nhật khi có kết quả.</p><div class="score-row"><div class="score-orb"><div><strong>…</strong><small> AI</small></div></div><div class="hero-meta"><b>Đang xử lý</b><br>${esc(x.examTitle||'HSKK Speaking')} · ${esc(x.version||'')} · ${esc(x.levelLabel||'')}<br>Không cần nộp lại bài.</div></div></section><div class="warn">Giữ trang này mở hoặc quay lại cùng đường dẫn kết quả sau. Thời gian xử lý phụ thuộc độ dài audio và trạng thái dịch vụ Gemini.</div>`;clearTimeout(pollTimer);pollTimer=setTimeout(load,4000);return}clearTimeout(pollTimer);if(x.status==='failed'){$('app').innerHTML=`<div class="error"><b>Bài đã được lưu nhưng Gemini chưa chấm được.</b><p>${esc(x.errorMessage||'Vui lòng kiểm tra GEMINI_API_KEY trên Render.')}</p><a href="/hskk.html">Quay lại kho HSKK</a></div>`;return}renderResult(x)}catch(e){clearTimeout(pollTimer);$('app').innerHTML=`<div class="error">${esc(e.message)}<p><a href="/hskk.html">Quay lại kho HSKK</a></p></div>`}}load();
</script><script src="js/road-motion.js" defer></script></body></html>
