<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROAD TO HSK 9 — Kết quả AI Speaking</title><link rel="stylesheet" href="ai-review.css"><link rel="icon" type="image/png" href="/logo.png"><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><link rel="stylesheet" href="css/eit-motion.css"><link rel="stylesheet" href="css/road-motion.css">
</head><body class="ai-page"><div class="ai-shell"><header class="ai-head"><div class="ai-brand"><img src="/logo.png" alt="ROAD TO HSK 9"><div><b>ROAD TO HSK 9</b><span>Giáo viên AI IELTS · Speaking</span></div></div><a class="ai-link" href="index.html">Quay lại khu luyện thi</a></header><main id="app"><div class="loading"><div class="loading-spinner"></div>Loading your AI Speaking result…</div></main></div>
<script>
const id=new URLSearchParams(location.search).get('id');const token=JSON.parse(localStorage.getItem('currentUser')||'{}').token||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=a=>Array.isArray(a)?a:[];function addPdfButton(skill){const app=document.getElementById('app');if(!app||document.getElementById('downloadPdf'))return;const bar=document.createElement('div');bar.className='pdf-toolbar';bar.innerHTML='<button id=\"downloadPdf\" class=\"pdf-download\" type=\"button\">⬇ TẢI FEEDBACK PDF</button><span>Xuất toàn bộ kết quả và feedback đang hiển thị.</span>';app.prepend(bar);document.getElementById('downloadPdf').onclick=async()=>{const b=document.getElementById('downloadPdf');b.disabled=true;b.textContent='ĐANG TẠO PDF…';try{await html2pdf().set({margin:8,filename:'EIT-IELTS-'+skill+'-feedback-'+(id||'result')+'.pdf',image:{type:'jpeg',quality:.96},html2canvas:{scale:1.45,useCORS:true,backgroundColor:'#f8fafc'},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'},pagebreak:{mode:['css','legacy']}}).from(app).save()}finally{b.disabled=false;b.textContent='⬇ TẢI FEEDBACK PDF'}};}const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
function criteria(c){const m={fluency_coherence:'Fluency & Coherence',lexical_resource:'Lexical Resource',grammar:'Grammatical Range & Accuracy',pronunciation:'Pronunciation'};return `<div class="ai-grid">${Object.entries(m).map(([k,v])=>`<div class="ai-criterion"><span>${v}</span><strong>${Number(c?.[k]??0).toFixed(1)}</strong></div>`).join('')}</div>`}
function list(title,items){const a=arr(items);return a.length?`<div class="feedback-block"><h4>${esc(title)}</h4><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
function partsCard(p,detail){return `<section class="ai-card part-card section"><div class="task-title"><h2>Part ${p.part}</h2></div><div class="feedback-block" style="border-top:0;padding-top:0;margin-top:8px"><h4>🧑‍🏫 Nhận xét của giám khảo</h4><p>${rich(p.summary||'')}</p></div>${list('💪 Điểm mạnh',p.strengths)}${list('🎯 Điểm cần cải thiện',p.improvements)}${detail&&p.transcript?`<div class="feedback-block"><h4>📝 Transcript · Bản chép lời</h4><div class="transcript">${esc(p.transcript)}</div></div>`:''}</section>`}
async function load(){try{if(!id)throw Error('Missing submission ID.');const r=await fetch('/api/ai/review/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Unable to load result.');if(d.status==='failed'){document.getElementById('app').innerHTML=`<div class="error-box"><b>AI Speaking grading is not available yet.</b><div style="margin-top:7px">${esc(d.errorMessage||'Please try again later.')}</div></div>`;return}const detail=!!d.detailAllowed,x=d.review||{};document.getElementById('app').innerHTML=`<section class="ai-hero"><div class="eyebrow">IELTS SPEAKING · KẾT QUẢ AI</div><h1>Phân tích Speaking chi tiết</h1><p>AI chấm nghiêm theo tiêu chí IELTS và giải thích bằng tiếng Việt: <strong>điểm mạnh → lỗi → lý do → ngữ cảnh → quy tắc → cách cải thiện</strong>.</p><div class="ai-overall"><div><div class="score-orb"><div class="score-inner"><div class="ai-score">${Number(d.overallBand??0).toFixed(1)}</div><div class="score-label">Band Speaking</div></div></div><div class="hero-meta"><span class="hero-chip">4 tiêu chí</span><span class="hero-chip">3 phần</span><span class="hero-chip">Giám khảo AI</span></div></div><div style="max-width:650px;width:100%"><div class="eyebrow">EXAMINER OVERVIEW</div><p style="font-size:15px;margin-top:7px">${esc(x.examiner_summary||'Your speaking performance has been assessed across the submitted recordings.')}</p></div></div></section><section class="ai-card section"><div class="eyebrow">PHÂN TÍCH 4 TIÊU CHÍ</div>${criteria(x.criteria)}</section>${x.audioLimitation?`<section class="ai-card section" style="border-color:#f59e0b;background:#fffbeb"><div class="eyebrow" style="color:#92400e">IMPORTANT</div><p style="margin:8px 0 0;color:#78350f;line-height:1.65">${esc(x.audioLimitation)}</p></section>`:''}${arr(x.part_feedback).map(p=>partsCard(p,detail)).join('')}${detail?`<section class="ai-card section"><div class="eyebrow">PRONUNCIATION LAB</div><div class="pro-title"><h3>Phân tích phát âm mục tiêu</h3><span class="pro-badge">EIT PRO</span></div><div style="overflow:auto;margin-top:14px"><table class="pron-table"><thead><tr><th>Từ/cụm từ</th><th>Gợi ý phát âm</th><th>Giải thích & ngữ cảnh</th></tr></thead><tbody>${arr(x.pronunciation_issues).map(p=>`<tr><td><strong>${esc(p.word)}</strong></td><td><strong>${esc(p.suggested)}</strong></td><td>${rich(p.explanation)}</td></tr>`).join('')||'<tr><td colspan="3">No high-priority pronunciation issues detected.</td></tr>'}</tbody></table></div>${x.detailed_corrections?.length?`<div class="feedback-block"><h4>🔎 Sửa từng câu · Logic & ngữ cảnh</h4><div style="overflow:auto"><table class="error-table"><thead><tr><th>Câu gốc</th><th>Câu cải thiện</th><th>Loại</th><th>Vì sao?</th><th>Ngữ cảnh</th><th>Quy tắc / logic</th></tr></thead><tbody>${arr(x.detailed_corrections).map(e=>`<tr><td><strong>${esc(e.original)}</strong></td><td class="good-cell"><strong>${esc(e.improved)}</strong></td><td>${rich(e.category)}</td><td>${rich(e.reason)}</td><td>${rich(e.context||'')}</td><td>${rich(e.rule||'')}</td></tr>`).join('')}</tbody></table></div></div>`:''}${x.upgraded_response?`<div class="feedback-block"><h4>✨ Câu trả lời Speaking nâng cấp</h4><div class="transcript">${esc(x.upgraded_response)}</div></div>`:''}${list('🛠 Kế hoạch luyện tập',x.action_plan)}</section>`:`<section class="ai-card section"><div class="locked"><div><h3>Mở khóa phân tích Speaking đầy đủ</h3><p>PRO có transcript đầy đủ, phân tích phát âm, sửa từng câu, giải thích ngữ cảnh/quy tắc, câu trả lời nâng cấp và kế hoạch luyện tập.</p></div><span class="pro-badge">EIT PRO</span></div></section>`}${list('🔥 Ưu tiên sửa ngay',x.priority_fixes)}`;}catch(e){document.getElementById('app').innerHTML=`<div class="error-box">${esc(e.message)}</div>`}}load();
</script><script src="js/road-motion.js" defer></script>
</body></html>
