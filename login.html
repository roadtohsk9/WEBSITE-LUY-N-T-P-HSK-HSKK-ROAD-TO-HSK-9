<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROAD TO HSK 9 — Đăng nhập</title><link rel="stylesheet" href="css/site.css"><link rel="icon" type="image/png" href="/logo.png"><link rel="stylesheet" href="css/eit-motion.css">
<style>
:root{--hsk-blue:#2563eb;--hsk-deep:#1e40af}body.login-page{background:#f3f7ff}.login-card{border-radius:16px!important}.login-card .brand b{color:var(--hsk-deep)}.login-card h1{color:#172033;font-size:clamp(24px,4vw,32px);line-height:1.3;margin-bottom:24px}.login-card .primary{background:var(--hsk-blue)!important;border-radius:10px!important}.login-card input{border-radius:9px!important}.login-note{font-size:13px;line-height:1.6;color:#64748b;margin-top:16px}.login-card .muted{line-height:1.6}
</style><link rel="stylesheet" href="css/road-motion.css">
</head>
<body class="login-page"><main class="login-shell"><section class="login-card"><div class="brand"><img src="/logo.png" alt="ROAD TO HSK 9 logo"><div><b>ROAD TO HSK 9</b><span>Nền tảng luyện thi HSK 3–6</span></div></div><h1>Chào mừng bạn đến với trải nghiệm học tập trực tuyến</h1>
<form id="loginForm"><label for="username">Username<input id="username" name="username" autocomplete="username" autocapitalize="none" required placeholder="Nhập username"></label><label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Nhập password"></label><button class="primary" type="submit">ĐĂNG NHẬP</button><div id="errorMessage" class="error" role="alert"></div></form></section></main><script src="js/app.js"></script><script src="js/road-motion.js" defer></script>
</body></html>
